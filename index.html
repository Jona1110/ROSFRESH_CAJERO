<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja POS | Rosfresh</title>
    <link rel="stylesheet" href="cajero.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    <div id="loader" class="loader-overlay"><div class="spinner"></div></div>

    <header class="pos-header">
        <div class="pos-brand">
            <i class="fas fa-cash-register"></i>
            <h2>Rosfresh <span>Caja Local</span></h2>
        </div>
        <div class="pos-search">
            <i class="fas fa-search"></i>
            <input type="text" id="searchPosInput" placeholder="Buscar producto para venta...">
        </div>
        <button class="btn-history-toggle" id="btnOpenHistory">
            <i class="fas fa-history"></i> Historial de Ventas
        </button>
    </header>

    <div class="pos-container">
        <!-- SECCIÓN DE PRODUCTOS -->
        <section class="pos-products-section">
            <div class="pos-categories" id="posCategoryNav">
                <button class="cat-btn active" data-cat="Todos">Todos</button>
                <button class="cat-btn" data-cat="Desayunos">Desayunos</button>
                <button class="cat-btn" data-cat="Snacks">Snacks</button>
                <button class="cat-btn" data-cat="Bebidas">Bebidas</button>
                <button class="cat-btn" data-cat="Postres">Postres</button>
                <button class="cat-btn" data-cat="Paquetes">Paquetes</button>
            </div>
            <div class="pos-grid" id="posMenuContainer">
                <!-- Se cargan dinámicamente -->
            </div>
        </section>

        <!-- SECCIÓN DE TICKET / CARRITO -->
        <aside class="pos-cart-section">
            <div class="cart-title">
                <h3><i class="fas fa-receipt"></i> Ticket de Venta</h3>
                <span id="posItemCount">0 items</span>
            </div>

            <div class="pos-cart-items" id="posCartItems">
                <div class="empty-pos-cart">
                    <i class="fas fa-shopping-cart"></i>
                    <p>No hay productos en el ticket</p>
                </div>
            </div>

            <div class="pos-cart-footer">
                <div class="payment-method-box">
                    <label>Método de Pago:</label>
                    <select id="paymentMethod">
                        <option value="Efectivo">💵 Efectivo</option>
                        <option value="Tarjeta">💳 Tarjeta</option>
                        <option value="Transferencia">📱 Transferencia</option>
                    </select>
                </div>

                <div class="pos-total-row">
                    <span>Total a cobrar:</span>
                    <span class="pos-total-amount">$<span id="posCartTotal">0.00</span></span>
                </div>

                <button class="btn-cobrar" id="btnCobrar"><i class="fas fa-check-circle"></i> Cobrar y Registrar Venta</button>
            </div>
        </aside>
    </div>

    <!-- MODAL DE PERSONALIZACIÓN DE PRODUCTO EN CAJA -->
    <div class="history-modal-overlay" id="posCustomModalOverlay" style="z-index: 1050;"></div>
    <div id="posCustomModal" class="history-modal custom-pos-modal">
        <div class="history-modal-header">
            <h3>Personalizar: <span id="modalProductName" style="color: var(--primary-dark); margin-left: 5px;">Producto</span></h3>
            <button class="close-history-modal" id="closeCustomModal">&times;</button>
        </div>
        <div class="history-modal-body">
            <h4 class="custom-title">🍫 Elige Salsas</h4>
            <div class="options-grid">
                <label><input type="checkbox" name="pos_salsa" value="Nutella"> Nutella</label>
                <label><input type="checkbox" name="pos_salsa" value="Hershey's"> Hershey’s</label>
                <label><input type="checkbox" name="pos_salsa" value="Mermelada"> Mermelada</label>
                <label><input type="checkbox" name="pos_salsa" value="Lotus"> Lotus</label>
                <label><input type="checkbox" name="pos_salsa" value="Dubái"> Dubái</label>
                <label><input type="checkbox" name="pos_salsa" value="Rafaelo"> Rafaelo</label>
            </div>

            <h4 class="custom-title" style="margin-top: 20px;">✨ Elige Toppings</h4>
            <div class="options-grid">
                <label><input type="checkbox" name="pos_topping" value="Mini Kisses"> Mini Kisses</label>
                <label><input type="checkbox" name="pos_topping" value="Arroz inflado"> Arroz inflado</label>
                <label><input type="checkbox" name="pos_topping" value="Coco"> Coco</label>
                <label><input type="checkbox" name="pos_topping" value="Coco tostado"> Coco tostado</label>
                <label><input type="checkbox" name="pos_topping" value="Chispitas de colores"> Chispitas</label>
                <label><input type="checkbox" name="pos_topping" value="Chispitas de chocolate"> Chispas Choc.</label>
                <label><input type="checkbox" name="pos_topping" value="Cereales"> Cereales</label>
                <label><input type="checkbox" name="pos_topping" value="Nuez"> Nuez</label>
            </div>
        </div>
        <div style="padding: 20px; border-top: 1px solid var(--gray-border); background: #fafafa; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;">
            <button id="confirmCustomBtn" class="btn-cobrar" style="background: var(--text-dark); box-shadow: none;">
                <i class="fas fa-plus"></i> Añadir al Ticket
            </button>
        </div>
    </div>

    <!-- MODAL DE HISTORIAL DE VENTAS -->
    <div class="history-modal-overlay" id="historyModalOverlay">
        <div class="history-modal" style="max-width: 800px;">
            <div class="history-modal-header">
                <h3><i class="fas fa-history" style="color: var(--primary-dark);"></i> Historial de Ventas Registradas</h3>
                <button class="close-history-modal" id="btnCloseHistory">&times;</button>
            </div>
            <div class="history-modal-body">
                <div class="table-responsive">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Fecha / Hora</th>
                                <th>Detalle de Venta</th>
                                <th>Monto</th>
                                <th style="text-align: center;">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tbHistorySales">
                            <!-- Se llena mediante JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="cajero.js"></script>
</body>
</html>
